name: Cafe24 FTP Manual Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deployment mode"
        required: true
        default: test_only
        type: choice
        options:
          - test_only
          - theme_basic_changed

permissions:
  contents: read

jobs:
  deploy:
    name: Cafe24 FTP deploy
    runs-on: ubuntu-latest
    env:
      CAFE24_PATH: /www
    steps:
      - name: Block non-test deploy modes
        if: ${{ inputs.deploy_mode != 'test_only' }}
        run: |
          echo "Only test_only mode is enabled. Real file deployment is intentionally disabled."
          exit 1

      - name: Install FTP client
        if: ${{ inputs.deploy_mode == 'test_only' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Create test artifact
        if: ${{ inputs.deploy_mode == 'test_only' }}
        run: |
          cat > deploy-test.txt <<'EOF'
          Cafe24 FTP deployment test
          Repository: ${{ github.repository }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          EOF

      - name: Upload deploy-test.txt
        if: ${{ inputs.deploy_mode == 'test_only' }}
        env:
          CAFE24_HOST: ${{ secrets.CAFE24_HOST }}
          CAFE24_USERNAME: ${{ secrets.CAFE24_USERNAME }}
          CAFE24_PASSWORD: ${{ secrets.CAFE24_PASSWORD }}
          CAFE24_PORT: ${{ secrets.CAFE24_PORT }}
        run: |
          test -n "$CAFE24_HOST"
          test -n "$CAFE24_USERNAME"
          test -n "$CAFE24_PASSWORD"
          test -n "$CAFE24_PORT"
          test -n "$CAFE24_PATH"

          lftp -u "$CAFE24_USERNAME","$CAFE24_PASSWORD" -p "$CAFE24_PORT" "$CAFE24_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2
          cd "$CAFE24_PATH"
          put deploy-test.txt -o deploy-test.txt
          bye
          EOF
