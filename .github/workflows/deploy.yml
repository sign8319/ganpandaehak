name: Cafe24 FTP Manual Test Deploy

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Upload only deploy-test.txt"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-test:
    name: Upload deploy-test.txt
    runs-on: ubuntu-latest
    if: ${{ inputs.test_only == true }}
    steps:
      - name: Create test artifact
        run: |
          cat > deploy-test.txt <<'EOF'
          Cafe24 FTP deployment test
          Repository: ${{ github.repository }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.run_id }}
          EOF

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload test file to Cafe24
        env:
          CAFE24_HOST: ${{ secrets.CAFE24_HOST }}
          CAFE24_USERNAME: ${{ secrets.CAFE24_USERNAME }}
          CAFE24_PASSWORD: ${{ secrets.CAFE24_PASSWORD }}
          CAFE24_PORT: ${{ secrets.CAFE24_PORT }}
          CAFE24_PATH: ${{ secrets.CAFE24_PATH }}
        run: |
          test -n "$CAFE24_HOST"
          test -n "$CAFE24_USERNAME"
          test -n "$CAFE24_PASSWORD"
          test -n "$CAFE24_PORT"
          test -n "$CAFE24_PATH"

          lftp -u "$CAFE24_USERNAME","$CAFE24_PASSWORD" -p "$CAFE24_PORT" "$CAFE24_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2
          cd "$CAFE24_PATH"
          put deploy-test.txt -o deploy-test.txt
          bye
          EOF

  full-deploy-disabled:
    name: Full deploy is disabled
    runs-on: ubuntu-latest
    if: ${{ inputs.test_only != true }}
    steps:
      - name: Stop full deploy
        run: |
          echo "Full site deployment is intentionally disabled. Re-run with test_only=true."
          exit 1
