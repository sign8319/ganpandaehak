name: Cafe24 FTP Manual Test Deploy

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: "Upload only deploy-test.txt"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-test:
    name: Probe Cafe24 FTP paths
    runs-on: ubuntu-latest
    if: ${{ inputs.test_only == true }}
    steps:
      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Probe FTP directories
        env:
          CAFE24_HOST: ${{ secrets.CAFE24_HOST }}
          CAFE24_USERNAME: ${{ secrets.CAFE24_USERNAME }}
          CAFE24_PASSWORD: ${{ secrets.CAFE24_PASSWORD }}
          CAFE24_PORT: ${{ secrets.CAFE24_PORT }}
        run: |
          test -n "$CAFE24_HOST"
          test -n "$CAFE24_USERNAME"
          test -n "$CAFE24_PASSWORD"
          test -n "$CAFE24_PORT"

          echo "::group::FTP login directory"
          lftp -u "$CAFE24_USERNAME","$CAFE24_PASSWORD" -p "$CAFE24_PORT" "$CAFE24_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2
          pwd
          cls -la
          bye
          EOF
          echo "::endgroup::"

          for target_path in "/" "/www" "/WWW"; do
            echo "::group::FTP path probe ${target_path}"
            if lftp -u "$CAFE24_USERNAME","$CAFE24_PASSWORD" -p "$CAFE24_PORT" "$CAFE24_HOST" <<EOF
          set ftp:passive-mode true
          set ftp:ssl-allow no
          set net:timeout 30
          set net:max-retries 2
          cd "${target_path}"
          pwd
          cls -la
          bye
          EOF
            then
              echo "FTP path probe succeeded: ${target_path}"
            else
              echo "FTP path probe failed: ${target_path}"
            fi
            echo "::endgroup::"
          done

      - name: Test upload is disabled
        run: |
          echo "deploy-test.txt upload is disabled until a writable Cafe24 FTP path is confirmed."

  full-deploy-disabled:
    name: Full deploy is disabled
    runs-on: ubuntu-latest
    if: ${{ inputs.test_only != true }}
    steps:
      - name: Stop full deploy
        run: |
          echo "Full site deployment is intentionally disabled. Re-run with test_only=true."
          exit 1
